name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The CLI against the fixture, as a user would run it.
      - run: cargo run --locked -q -p agent-board -- item list --snapshot fixtures/board.json
      - run: cargo run --locked -q -p agent-board -- reconcile plan --snapshot fixtures/board.json --emit
